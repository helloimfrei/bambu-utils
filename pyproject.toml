[project]
name = "bambu-utils"
version = "0.1.0"
description = "Direct LAN utilities for Bambu Lab printers"
readme = "README.md"
authors = [
    { name = "Christian Tapp", email = "christianjtapp@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "paho-mqtt>=2.1,<3",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1,<2",
    "uvicorn>=0.35,<1",
]

[project.scripts]
bambu-utils = "bambu_utils:main"
bambu-dashboard = "bambu_utils.web:main"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pyright>=1.1.403",
    "pytest>=8.4",
]

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"
