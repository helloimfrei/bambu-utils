[project]
name = "bambu-utils"
version = "0.1.0"
description = "Direct LAN utilities for Bambu Lab printers"
readme = "README.md"
authors = [
    { name = "Christian Tapp", email = "christianjtapp@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "python-dotenv>=1.1,<2",
]

[project.scripts]
bambu-utils = "bambu_utils:main"

[dependency-groups]
dev = [
    "pyright>=1.1.403",
    "pytest>=8.4",
]

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"
